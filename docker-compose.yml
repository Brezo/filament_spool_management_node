services:
  filamentregal:
    build:
      context: .
      dockerfile: Dockerfile
    image: filamentregal:latest
    container_name: filamentregal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/filament.db
    volumes:
      - filament_data:/data

volumes:
  filament_data:
